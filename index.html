<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Axie Smash</title><link rel="stylesheet" href="./css/styles.css"><link rel="stylesheet" href="./css/layout.css"><link rel="stylesheet" href="./css/arcade.css"></head>
<body class="arcade-theme"><main id="stage" aria-label="Axie Smash">
<canvas id="game" width="1280" height="720"></canvas>
<section id="scene" class="screen"><p role="status">Cargando recursos…</p></section>
<aside id="hud" hidden><div id="hud-p1"></div><strong id="timer">60</strong><div id="hud-p2"></div></aside>
<div id="callout" hidden aria-live="polite"><span id="round-label"></span><strong id="round-word"></strong></div>
<div id="touch" hidden><button data-key="a">◀</button><button data-key="d">▶</button><button data-key="w">⤒</button><button data-key="j">J</button><button data-key="k">K</button><button data-key="l">L</button></div>
<footer>AXIE SMASH · VibeAthon Edition</footer>
</main><script type="module" src="./js/game.js"></script></body></html>
